  - brute_force_admin: Brute force admin
    from:
      - network_access: <0.1>
  - hypervisor_root: Root on hypervisor
    from:
      - get_hpc_admin: ❓
      - hpc_vuln: mitigated <0.2>
      - ssh_exploit
  - exploit_hpc_endpoint: Exploit a vulnerable HPC endpoint
    from:
